apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-external
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wp-custom-image
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: USE_INTERNAL_DB
              value: "false"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "wordpress"
            - name: WORDPRESS_DB_PASSWORD
              value: "password"
            - name: WORDPRESS_DB_HOST
              value: "host.docker.internal:3310"
